<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vstupní konzultace · Marcel AI · Aeternum Clinic</title>
<meta name="theme-color" content="#19191B">
<meta name="robots" content="noindex">
<meta name="description" content="Vstupní e-konzultace Aeternum Clinic. Projdeme spolu, jak terapie GLP-1 funguje, jaký program Vám vychází a co obnáší vstupní screening.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --ground:#19191B; --ink:#F4F4F6; --muted:rgba(244,244,246,.62); --dim:rgba(244,244,246,.40);
  --line:rgba(255,255,255,.14); --line2:rgba(255,255,255,.24);
  --grad:linear-gradient(90deg,#7A3E9E,#2F86CC);
  --grad-135:linear-gradient(135deg,#7A3E9E,#2F86CC);
  --grad-text:linear-gradient(90deg,#A27AD2,#4FA3E0);
  --good:#5ED3A0; --ok:#B5D333; --warn:#F2B45A; --crit:#EE7A6D;
  --gut:clamp(18px,calc(5*var(--u)),calc(96px*var(--k)));
  --u:min(1vw,1.7778vh); --k:1;
  --font:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (min-width:2200px) and (min-height:1200px){:root{--k:1.35}}
@media (min-width:3000px) and (min-height:1650px){:root{--k:2}}
@media (max-width:760px){:root{--u:1vw}}
html{-webkit-text-size-adjust:100%}
body{touch-action:manipulation}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font)}
body{min-height:100dvh;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
p{margin:0}
:focus-visible{outline:2px solid #4FA3E0;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- pozadí ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--ground)}
.glow{position:absolute;border-radius:50%;filter:blur(40px)}

/* ---------- kostra ---------- */
.app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:clamp(14px,calc(2*var(--u)),calc(34px*var(--k))) var(--gut) 0;flex:none}
.logo{display:flex;align-items:center;gap:clamp(10px,calc(1*var(--u)),calc(18px*var(--k)));text-decoration:none;color:inherit}
.logo svg{width:clamp(32px,calc(2.3*var(--u)),calc(46px*var(--k)));height:clamp(32px,calc(2.3*var(--u)),calc(46px*var(--k)));fill:none;stroke:#6B3A96;stroke-width:6.5;flex:none}
.logo .wm{display:flex;flex-direction:column;gap:3px}
.logo .wm b{font-size:clamp(15px,calc(1.1*var(--u)),calc(22px*var(--k)));font-weight:600;letter-spacing:.035em;line-height:1;background:linear-gradient(90deg,#6E3D9C,#2F7FC4);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .wm span{font-size:clamp(7px,calc(.5*var(--u)),calc(10px*var(--k)));letter-spacing:.44em;color:#6B4A9A;font-weight:500;line-height:1}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;color:var(--dim);font-size:clamp(10px,calc(.68*var(--u)),calc(13px*var(--k)));font-weight:600;letter-spacing:.2em;text-transform:uppercase;text-decoration:none}
.linkbtn:hover{color:var(--ink)}

/* ---------- postup ---------- */
.prog{flex:none;padding:clamp(10px,calc(1.2*var(--u)),calc(22px*var(--k))) var(--gut) 0;display:flex;gap:6px;align-items:center}
.prog i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;position:relative}
.prog i.done{background:var(--grad)}
.prog i.on::after{content:'';position:absolute;inset:0;background:var(--grad);transform-origin:left;animation:fill .5s ease forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(.55)}}
.progl{flex:none;padding:8px var(--gut) 0;font-size:clamp(9.5px,calc(.62*var(--u)),calc(12px*var(--k)));letter-spacing:.24em;text-transform:uppercase;color:var(--dim);font-weight:600}

/* ---------- rozhovor ---------- */
.talk{flex:1;overflow-y:auto;padding:clamp(14px,calc(1.8*var(--u)),calc(30px*var(--k))) var(--gut) 10px;scroll-behavior:smooth}
.inner{max-width:calc(820px*var(--k));margin:0 auto;display:flex;flex-direction:column;gap:clamp(12px,calc(1.2*var(--u)),calc(20px*var(--k)))}
.row{display:flex;gap:clamp(10px,calc(.9*var(--u)),calc(16px*var(--k)));align-items:flex-end;animation:pop .32s ease both}
@keyframes pop{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.row.me{flex-direction:row-reverse}
.ava{width:clamp(34px,calc(2.5*var(--u)),calc(48px*var(--k)));height:clamp(34px,calc(2.5*var(--u)),calc(48px*var(--k)));border-radius:50%;object-fit:cover;flex:none;border:1.5px solid rgba(255,255,255,.18)}
.ava.hide{visibility:hidden}
.bub{max-width:min(78%,calc(600px*var(--k)));padding:clamp(12px,calc(1.05*var(--u)),calc(20px*var(--k))) clamp(15px,calc(1.3*var(--u)),calc(24px*var(--k)));border-radius:20px 20px 20px 6px;background:rgba(255,255,255,.055);border:1px solid var(--line);font-size:clamp(14px,calc(1.02*var(--u)),calc(18px*var(--k)));line-height:1.62;letter-spacing:.012em;word-break:keep-all;overflow-wrap:break-word}
.row.me .bub{border-radius:20px 20px 6px 20px;background:var(--grad-135);border-color:transparent;color:#fff;font-weight:500}
.bub b{font-weight:700}
.bub .hl{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.bub ul{margin:8px 0 0;padding-left:18px}
.bub li{margin-bottom:6px}
.bub .note{display:block;margin-top:10px;font-size:.84em;color:var(--muted)}

/* psaní */
.typing{display:flex;gap:5px;padding:16px 20px}
.typing span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.18s}
.typing span:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* karty uvnitř rozhovoru */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px;margin-top:12px}
.card{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:linear-gradient(135deg,rgba(122,62,158,.12),rgba(47,134,204,.08))}
.card b{display:block;font-size:.95em;margin-bottom:5px}
.card span{font-size:.84em;color:var(--muted);line-height:1.5}
.plan{margin-top:12px;border:1px solid var(--line2);border-radius:16px;padding:16px 18px;background:rgba(255,255,255,.04)}
.plan .pr{font-size:clamp(26px,calc(2.3*var(--u)),calc(44px*var(--k)));font-weight:700;letter-spacing:-.01em;line-height:1.1}
.plan .pm{font-size:.86em;color:var(--muted);margin-top:4px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-top:1px solid var(--line);font-size:.9em}
.kv:first-of-type{border-top:0}
.kv span{color:var(--muted)}
.kv b{font-weight:700;text-align:right}

/* ---------- ovládání ---------- */
.dock{flex:none;padding:0 var(--gut) clamp(14px,calc(1.8*var(--u)),calc(30px*var(--k)));background:linear-gradient(180deg,rgba(25,25,27,0),rgba(25,25,27,.92) 28%)}
.dockin{max-width:calc(820px*var(--k));margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-bottom:10px}
.chip{border:1.5px solid var(--line2);background:rgba(25,25,27,.6);color:var(--ink);border-radius:999px;padding:10px 18px;font-size:clamp(12.5px,calc(.88*var(--u)),calc(15px*var(--k)));font-weight:500;cursor:pointer;transition:border-color .15s,background .15s;text-align:left}
.chip:hover{border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.06)}
.chip.go{background:var(--grad);border-color:transparent;color:#fff;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:clamp(11.5px,calc(.78*var(--u)),calc(14px*var(--k)));padding:12px 24px}
.chip.go:hover{filter:brightness(1.12);background:var(--grad)}
.chip.faq{font-size:clamp(12px,calc(.82*var(--u)),calc(14px*var(--k)));color:var(--muted)}
.ask{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.04);padding:7px 7px 7px 16px}
.ask textarea{flex:1;background:none;border:0;resize:none;outline:none;font-size:clamp(14px,calc(.98*var(--u)),calc(17px*var(--k)));line-height:1.5;max-height:120px;padding:9px 0}
.ask textarea::placeholder{color:var(--dim)}
.send{flex:none;width:clamp(42px,calc(2.9*var(--u)),calc(52px*var(--k)));height:clamp(42px,calc(2.9*var(--u)),calc(52px*var(--k)));border-radius:50%;border:0;background:var(--grad);cursor:pointer;display:flex;align-items:center;justify-content:center}
.send svg{width:46%;height:46%;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.send[disabled]{opacity:.35;cursor:default}
.hint{margin-top:8px;font-size:clamp(10.5px,calc(.7*var(--u)),calc(13px*var(--k)));color:var(--dim);text-align:center}
.hint a{color:var(--muted)}

/* ---------- cesta 1-2-3 ---------- */
.way{flex:none;padding:clamp(10px,calc(1.1*var(--u)),calc(20px*var(--k))) var(--gut) 0;display:flex;gap:clamp(8px,calc(.8*var(--u)),calc(16px*var(--k)));max-width:calc(820px*var(--k));margin:0 auto;width:100%}
.way .st{flex:1;display:flex;gap:9px;align-items:flex-start;opacity:.34;transition:opacity .45s ease}
.way .st.on,.way .st.done{opacity:1}
.way .st i{flex:none;font-style:normal;font-weight:800;font-size:clamp(17px,calc(1.5*var(--u)),calc(28px*var(--k)));line-height:1;background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.way .st .lb{min-width:0}
.way .st b{display:block;font-size:clamp(11px,calc(.78*var(--u)),calc(14px*var(--k)));font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.way .st b .sm{display:none}
@media (max-width:760px){.way .st b .lg{display:none}.way .st b .sm{display:inline}.way{gap:7px}}
.way .st .bar{margin-top:6px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.way .st .bar u{display:block;height:100%;width:0;background:var(--grad);transition:width .6s cubic-bezier(.4,0,.2,1)}
.way .st.done .bar u{width:100%}

/* ---------- výběr varianty programu ---------- */
.vars{display:grid;gap:10px;margin-top:14px}
.var{text-align:left;width:100%;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;background:rgba(255,255,255,.04);cursor:pointer;transition:border-color .15s,background .15s,transform .15s;display:block;animation:pop .36s ease both}
.var:hover{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.07)}
.var.sel{border-color:transparent;background:linear-gradient(135deg,rgba(122,62,158,.3),rgba(47,134,204,.22));box-shadow:0 0 0 1.5px rgba(162,122,210,.75)}
.var .vh{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.var .vn{font-weight:700;font-size:1.02em}
.var .vp{font-weight:700;font-size:clamp(17px,calc(1.45*var(--u)),calc(26px*var(--k)));white-space:nowrap;font-variant-numeric:tabular-nums}
.var .vp em{font-style:normal;font-size:.6em;font-weight:600;color:var(--muted)}
.var .vm{font-size:.84em;color:var(--muted);margin-top:2px}
.var .vd{font-size:.83em;color:var(--muted);line-height:1.5;margin-top:8px}
.var .tag{display:inline-block;margin-left:8px;font-size:.62em;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--grad);color:#fff;vertical-align:middle}

/* ---------- souhlasy ---------- */
.cons{margin-top:12px;display:grid;gap:2px}
.cons label{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border-radius:12px;cursor:pointer;transition:background .15s}
.cons label:hover{background:rgba(255,255,255,.04)}
.cons input{appearance:none;flex:none;width:21px;height:21px;margin:1px 0 0;border:1.5px solid var(--line2);border-radius:6px;cursor:pointer;position:relative;transition:background .15s,border-color .15s}
.cons input:checked{background:var(--grad-135);border-color:transparent}
.cons input:checked::after{content:'';position:absolute;left:6.5px;top:2.5px;width:5px;height:10px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(45deg)}
.cons span{font-size:.88em;line-height:1.55;color:var(--muted)}

/* ---------- shrnutí na konec ---------- */
/* ── Výběr termínu a platba ─────────────────────────────────────────────────
   Tři čtvrtiny lidí sem chodí z telefonu, takže karta termínu je velký
   terč přes celou šířku a datum je to první, co je na ní vidět. Žádné
   dva sloupce — na úzké obrazovce se z nich dělá mlha. */
.slots{display:grid;gap:10px;margin-top:14px}
.slot{text-align:left;width:100%;min-height:62px;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;background:rgba(255,255,255,.04);cursor:pointer;transition:border-color .15s,background .15s;display:flex;align-items:center;justify-content:space-between;gap:12px;animation:pop .36s ease both;color:inherit;font:inherit}
.slot:hover{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.07)}
.slot.sel{border-color:transparent;background:linear-gradient(135deg,rgba(122,62,158,.3),rgba(47,134,204,.22));box-shadow:0 0 0 1.5px rgba(162,122,210,.75)}
.slot .sd{font-weight:700;font-size:1.02em;line-height:1.25}
.slot .sw{display:block;font-size:.8em;font-weight:500;color:var(--muted);margin-top:2px}
.slot .st{font-weight:700;font-size:clamp(17px,calc(1.4*var(--u)),calc(24px*var(--k)));font-variant-numeric:tabular-nums;white-space:nowrap}
.slot.more{justify-content:center;min-height:52px;border-style:dashed}
.slot.more .sd{font-weight:600;font-size:.92em;color:var(--muted)}

/* Platba je poslední krok a nesmí se v ní dát ztratit: jedno tlačítko přes
   celou šířku, pod ním to, co klient potřebuje vědět, a nic jiného. */
.pay{display:block;width:100%;margin-top:14px;border:0;border-radius:14px;padding:16px 20px;background:var(--grad);color:#fff;font:inherit;font-weight:700;font-size:clamp(15px,calc(1.1*var(--u)),calc(18px*var(--k)));cursor:pointer;text-align:center;text-decoration:none;transition:filter .15s}
.pay:hover{filter:brightness(1.12)}
.pay[aria-busy="true"]{opacity:.6;pointer-events:none}
.paynote{margin-top:10px;font-size:.8em;color:var(--muted);line-height:1.55}
.paynote b{color:var(--ink);font-weight:600}
.sum{margin-top:12px;border:1px solid var(--line2);border-radius:18px;overflow:hidden;background:linear-gradient(135deg,rgba(122,62,158,.16),rgba(47,134,204,.1))}
.sum .sh{padding:16px 18px 13px;border-bottom:1px solid var(--line)}
.sum .se{font-size:.6em;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.sum .sn{font-size:clamp(18px,calc(1.6*var(--u)),calc(30px*var(--k)));font-weight:700;margin-top:5px;line-height:1.2}
.sum .sb{padding:12px 18px 16px}

/* ---------- stop ---------- */
.stop{border-left:3px solid var(--crit);padding-left:14px}
.sp{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:760px){
  .bub{max-width:86%}
  .chips{justify-content:stretch}
  .chip{flex:1 1 100%;text-align:center}
  .cards{grid-template-columns:1fr}
}

/* ---------- Světlý vzhled ----------------------------------------------
   Pozadí, černý text a limetkové tlačítko podle www.aeternumclinic.cz,
   stejně jako na screeningu a v rezervaci. Blok je schválně až na konci
   sešitu: přebíjí tmavé hodnoty výše, takže se dá celý smazat a stránka
   se vrátí do původní tmavé podoby. */
:root{
  --ground:#ECECEC; --ink:#141414;
  --muted:rgba(20,20,20,.68); --dim:rgba(20,20,20,.46);
  --line:rgba(20,20,20,.12); --line2:rgba(20,20,20,.22);
  --karta:rgba(255,255,255,.72);          /* plocha karet na světlém pozadí */
  --karta-line:rgba(20,20,20,.1);
}
html,body{background:var(--ground);color:var(--ink)}
.bg{background:var(--ground)}
/* barevné záře byly kreslené na tmavé pozadí, na světlém dělají špínu */
.glow{opacity:.1;filter:blur(70px)}

/* bubliny: Marcelova bílá, klientova zůstává v gradientu s bílým textem */
.bub{background:var(--karta);border-color:var(--karta-line)}
.typing span{background:rgba(20,20,20,.42)}

/* nabídky a karty */
.chip{background:rgba(255,255,255,.6);border-color:rgba(20,20,20,.2)}
.chip:hover{border-color:rgba(20,20,20,.5);background:rgba(255,255,255,.85)}
.var,.slot,.plan{background:rgba(255,255,255,.6);border-color:rgba(20,20,20,.14)}
.var:hover,.slot:hover{border-color:rgba(20,20,20,.45);background:rgba(255,255,255,.9)}
.cons label:hover{background:rgba(255,255,255,.6)}

/* ukazatele postupu */
.prog i{background:rgba(20,20,20,.14)}
.way .st .bar{background:rgba(20,20,20,.14)}

/* pole na dotaz a lišta pod ním */
.ask{background:rgba(255,255,255,.75);border-color:rgba(20,20,20,.16)}
.ask textarea::placeholder{color:rgba(20,20,20,.38)}
.dock{background:linear-gradient(180deg,rgba(236,236,236,0),rgba(236,236,236,.94) 28%)}

/* čekací kolečko mělo bílý okraj, na světlém by zmizelo */
.sp{border-color:rgba(20,20,20,.22);border-top-color:#141414}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logoMark" viewBox="0 0 120 120"><circle cx="45" cy="70" r="37"/><circle cx="70" cy="47" r="40"/></symbol>
</svg>
<div class="bg"><div class="glow" style="right:-14vw;top:-26vh;width:64vw;height:100vh;background:radial-gradient(closest-side,rgba(36,131,197,.26),rgba(122,62,158,.18) 60%,rgba(25,25,27,0))"></div></div>

<div class="app">
  <header class="top">
    <a class="logo" href="https://www.aeternumclinic.cz" aria-label="Aeternum Clinic"><svg aria-hidden="true"><use href="#logoMark"/></svg>
      <div class="wm"><b>AETERNUM</b><span>CLINIC</span></div></a>
    <a class="linkbtn" href="https://www.aeternumclinic.cz">Zpátky na web ›</a>
  </header>
  <div class="way" id="way" aria-hidden="true"></div>
  <div class="talk" id="talk"><div class="inner" id="inner"></div></div>
  <div class="dock">
    <div class="dockin">
      <div class="chips" id="chips"></div>
      <div class="ask" id="askbox">
        <textarea id="ask" rows="1" placeholder="Zeptejte se mě na cokoli…" aria-label="Dotaz"></textarea>
        <button class="send" id="sendBtn" aria-label="Odeslat dotaz"><svg viewBox="0 0 24 24"><path d="M5 12h13M12 5l7 7-7 7"/></svg></button>
      </div>
      <p class="hint" id="hint">Marcel AI je digitální kopie konzultanta Marcela. O vhodnosti terapie vždy rozhoduje lékař.</p>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   Aeternum Clinic — vstupní e-konzultace
   Scénář jede po kapitolách, mezi nimi se klient může kdykoli zeptat.
   Parametry URL: ?id=SC260920-ABC123 (navazuje na dokončený e-screening)
                  ?demo=1 (ukázková data pro ladění textů)
   ========================================================================== */

const URLP = new URLSearchParams(location.search);
const CFG = {
  apiUrl: 'https://script.google.com/macros/s/AKfycby5mSooRjSpT8CUoaQzhJLW60VzvJwva3e7nLnlLqDBG5FsKBdp70ykk9wO9fE5130p/exec',                                   // webová aplikace z aeternum_screening_apps_script.gs
  bookingUrl: 'https://booking.aeternumclinic.cz',
  screeningPrice: 4970,                         // stejné číslo jako CONFIG.ENTRY_SCREENING_PRICE na serveru

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => Math.round(n).toLocaleString('cs-CZ');

/* Jemné cuknutí při příchodu zprávy. iOS Safari to neumí, proto to nikdy
   nesmí být jediný signál — je to příjemnost navíc, ne nosná informace.
   Prohlížeč vibrace před prvním dotykem blokuje, tak to do té doby neřešíme. */
let tapped = false;
document.addEventListener('pointerdown', () => { tapped = true; }, { once: true, capture: true });
function buzz(ms = 8) { if (!tapped) return; try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

async function api(action, data, timeoutMs = 20000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(CFG.apiUrl, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, sid: S.sid, ...data }), signal: ctrl.signal
    });
    const j = await res.json();
    if (!j.ok) { const e = new Error(j.error || 'api'); e.code = j.error; throw e; }
    return j;
  } finally { clearTimeout(t); }
}

/* Čísla se nenaskakují, ale dopočítají — cena programu je vrchol celé
   konzultace a zaslouží si to. Kdo nechce čekat, klepnutím to přeskočí. */
function countUp(el, to, ms = 900) {
  const from = 0, t0 = performance.now();
  (function step(now) {
    const k = Math.min(1, (now - t0) / ms);
    const e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

function mesice(n) { return n === 1 ? 'měsíc' : (n >= 2 && n <= 4 ? 'měsíce' : 'měsíců'); }

/* ---------- vykreslení ---------- */
function bubble(html, opts = {}) {
  const row = document.createElement('div');
  row.className = 'row' + (opts.me ? ' me' : '');
  if (!opts.me) {
    const img = document.createElement('img');
    img.className = 'ava' + (opts.stack ? ' hide' : '');
    img.src = MARCEL_AVATAR; img.alt = 'Marcel';
    row.appendChild(img);
  }
  const b = document.createElement('div');
  b.className = 'bub' + (opts.cls ? ' ' + opts.cls : '');
  b.innerHTML = html;
  row.appendChild(b);
  $('#inner').appendChild(row);
  if (!opts.me) buzz();
  scroll();
  return row;
}

function typing() {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<img class="ava" src="${MARCEL_AVATAR}" alt=""><div class="bub typing"><span></span><span></span><span></span></div>`;
  $('#inner').appendChild(row);
  scroll();
  return row;
}

function scroll() { const t = $('#talk'); t.scrollTop = t.scrollHeight; }

/* Rytmus psaní dělá z formuláře rozhovor, ale nikdo nesmí být jeho rukojmím:
   klepnutí kamkoli do konverzace čekání přeskočí. */
let skipNow = null;
const wait = ms => new Promise(r => {
  const t = setTimeout(done, ms);
  function done() { clearTimeout(t); if (skipNow === done) skipNow = null; r(); }
  skipNow = done;
});
document.addEventListener('pointerdown', e => {
  if (!skipNow || e.target.closest('.dock')) return;
  skipNow();
});
/* Jak dlouho se tváří, že píše. Skutečný člověk u delší věty přemýšlí dýl
   a neodpovídá na takt metronomu, proto délka plus trocha náhody. Strop je
   nahoře proto, že čekání nad čtyři vteřiny už není rozmýšlení, ale porucha. */
const pace = txt => {
  const n = String(txt).replace(/<[^>]*>/g, '').length;
  return Math.round(Math.min(4000, 700 + n * 19) * (0.85 + Math.random() * 0.3));
};

/* Kolik zpráv za sebou smí napsat, než nechá klienta reagovat. Bez tohohle
   sype celou kapitolu v jednom bloku a je z toho cedule, ne rozhovor. */
const MAX_RUN = 2;

/* Co klient klepne, aby Marcel psal dál. Je to jeho replika, ne ovládací
   prvek, takže pořád stejné „Pokračovat" zní jako software. Střídají se
   po pořadí, ne náhodně — aby dvě stejné nepřišly za sebou a aby druhé
   projití konzultace vypadalo stejně jako první.

   Když se k nějaké replice hodí něco konkrétnějšího, napíše se té replice
   do `dal` a tenhle seznam se pro ni přeskočí. */
const DAL = ['Rozumím', 'Dobře', 'Jasně, pokračujte', 'Chápu', 'Dobře, můžeme dál', 'Rozumím, dál'];
let dalI = 0;
let dalTed = '';                       // co zrovna na tlačítku stojí
function dalLabel(beat) {
  dalTed = (beat && beat.dal) || DAL[dalI++ % DAL.length];
  return dalTed;
}

/* Cesta klienta, stejná trojice jako na webu. Ukazatel prvního kroku se plní
   podle toho, jak daleko je v konzultaci — druhý a třetí ho teprve čekají. */
const WAY = [
  { n: 1, label: 'Úvodní konzultace', short: 'Konzultace' },
  { n: 2, label: 'Vstupní screening', short: 'Screening' },
  { n: 3, label: 'Lékařské vyšetření', short: 'Vyšetření' }
];

function renderProgress(key) {
  const i = CHAPTERS.findIndex(c => c.key === key);
  const idx = i < 0 ? 0 : i;
  const share = CHAPTERS.length > 1 ? idx / (CHAPTERS.length - 1) : 1;
  const el = $('#way');
  if (!el.children.length) {
    el.innerHTML = WAY.map(w =>
      `<div class="st"><i>${w.n}</i><div class="lb"><b><span class="lg">${esc(w.label)}</span><span class="sm">${esc(w.short)}</span></b><div class="bar"><u></u></div></div></div>`).join('');
  }
  const steps = el.querySelectorAll('.st');
  steps[0].className = 'st on';
  steps[0].querySelector('u').style.width = Math.round(share * 100) + '%';
}

/* Tři varianty programu. Vykreslují se postupně a cena se dopočítá —
   je to okamžik, kdy klient poprvé vidí svoje číslo. */
async function renderVariants() {
  const vs = D.variants || [];
  const row = bubble('<div class="vars" id="vars"></div>');
  const box = row.querySelector('#vars');
  for (let i = 0; i < vs.length; i++) {
    const v = vs[i];
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'var';
    el.dataset.i = String(i);
    el.innerHTML = `<div class="vh"><span class="vn">${esc(v.name)}${v.rec ? '<span class="tag">doporučeno</span>' : ''}</span>` +
      `<span class="vp"><b data-p>0</b> Kč<em> /měs.</em></span></div>` +
      `<div class="vm">${v.months} ${mesice(v.months)}</div>` +
      `<div class="vd">${esc(v.desc || '')}</div>`;
    box.appendChild(el);
    countUp(el.querySelector('[data-p]'), v.price);
    buzz(6);
    scroll();
    await wait(380);
  }
  box.addEventListener('click', e => {
    const el = e.target.closest('.var');
    if (!el) return;
    const v = vs[Number(el.dataset.i)];
    box.querySelectorAll('.var').forEach(x => x.classList.remove('sel'));
    el.classList.add('sel');
    // drugIncluded si pamatujeme kvůli kartám: u programů na dálku
    // si léčivo kupuje klient sám a tvrdit mu opak by byla lež.
    S.variant = { name: v.name, months: v.months, price: v.price,
      key: v.key, drugIncluded: !!v.drugIncluded }; save();
    buzz(12);
    logLine('klient', 'Vybral variantu ' + v.name + ' · ' + v.months + ' měsíců · ' + v.price + ' Kč/měs.');
    setChips([{ label: 'Pokračovat s variantou ' + v.name, go: 'benefits', primary: true }]);
  });
  setChips([]);
}

/* Souhlasy. Každý zvlášť, žádné „souhlasím se vším“ — a ukládá se přesné
   znění, protože to je to, co klient opravdu viděl. */
const CONSENTS = [
  { k: 'ai', t: 'Beru na vědomí, že jsem úvodní konzultaci absolvoval(a) s digitálním asistentem, nikoli s lékařem, a že poskytnuté informace nejsou lékařskou radou ani diagnózou.' },
  { k: 'lekar', t: 'Rozumím tomu, že o vhodnosti terapie, volbě léku i dávkování rozhoduje výhradně lékař na základě výsledků vstupního screeningu.' },
  { k: 'platba', t: 'Rozumím tomu, že vstupní screening (5 170 Kč) není součástí léčby, hradí se předem, a že v případě zjištěné kontraindikace se laboratorní část (3 170 Kč) nevrací.' },
  { k: 'gdpr', t: 'Souhlasím se zpracováním osobních údajů v rozsahu nezbytném pro poskytnutí péče.' }
];

function renderConsents() {
  const row = bubble('<div class="cons" id="cons">' + CONSENTS.map((c, i) =>
    `<label><input type="checkbox" data-k="${c.k}" data-i="${i}"><span>${esc(c.t)}</span></label>`).join('') + '</div>');
  const box = row.querySelector('#cons');
  box.addEventListener('change', () => {
    const all = Array.from(box.querySelectorAll('input'));
    all.forEach(i => { S.consents[i.dataset.k] = i.checked ? { at: Date.now(), text: CONSENTS[Number(i.dataset.i)].t } : null; });
    save();
    buzz(10);
    const done = all.every(i => i.checked);
    setChips(done ? [{ label: 'Potvrdit a pokračovat k platbě', go: 'book', consent: true, primary: true }] : []);
  });
  setChips([]);
}

function setChips(list) {
  const el = $('#chips');
  // Na co už jsme odpověděli, podruhé nenabízíme — klient by dostal tutéž repliku.
  list = (list || []).filter(c => !(c.faq && S.asked[c.faq]));
  if (!list.length) { el.innerHTML = ''; return; }
  el.innerHTML = list.map((c, i) =>
    `<button type="button" class="chip${c.primary || c.go && list.length === 1 ? ' go' : ''}${c.faq ? ' faq' : ''}" data-i="${i}">${esc(c.label)}</button>`).join('');
  el._list = list;
  /* Nabídka ukrojí z výšky konverzace, takže poslední replika skončí schovaná
     za ní. Dorolujeme až po přepočtu rozvržení — hned po innerHTML prohlížeč
     novou výšku ještě nezná. */
  requestAnimationFrame(scroll);
}

/* ---------- výběr termínu a platba ---------- */

const DNY = ['neděle', 'pondělí', 'úterý', 'středa', 'čtvrtek', 'pátek', 'sobota'];
const MESICE_2P = ['ledna','února','března','dubna','května','června',
                   'července','srpna','září','října','listopadu','prosince'];

/* Server posílá termín jako místní čas bez zóny („2026-11-12T09:00"). Kdyby
   se to prohnalo new Date() rovnou, prohlížeč v jiné zóně by ho posunul. */
function parseSlot(iso) {
  const m = String(iso).match(/^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/);
  return m ? new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]) : new Date(iso);
}
function slotDay(d) {
  const dnes = new Date(); dnes.setHours(0, 0, 0, 0);
  const den = new Date(d); den.setHours(0, 0, 0, 0);
  const za = Math.round((den - dnes) / 86400000);
  if (za === 0) return 'dnes';
  if (za === 1) return 'zítra';
  return DNY[d.getDay()];
}
const slotDate = d => d.getDate() + '. ' + MESICE_2P[d.getMonth()];
const slotTime = d => d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');

/* Nejbližší termíny, přednostně do sedmi dnů: do té doby klient stihne odběr
   a delší odstup znamená, že si to rozmyslí. Když do týdne nic volného není,
   nabídneme nejbližší pozdější — poslat rozhodnutého člověka telefonovat je
   to nejhorší, co se v tuhle chvíli dá udělat. */
function nextSlots(all, limit) {
  const dny = all.map(parseSlot).sort((a, b) => a - b);
  const doTydne = dny.filter(d => d.getTime() <= Date.now() + 7 * 86400000);
  return (doTydne.length ? doTydne : dny).slice(0, limit);
}


let SLOTS = { all: [], form: '', picked: null, vs: null };

async function renderSlots(expand) {
  /* Nejdřív data, teprve pak mluvíme. Uvedení záleží na tom, co vyšlo —
     kdyby se skládalo dřív, tvrdilo by něco o termínech, které ještě nejsou
     načtené. Tečky zatím drží pozornost, načítání trvá vteřiny. */
  if (!SLOTS.all.length) {
    const t = expand ? null : typing();
    try {
      const r = await api('slots', { kind: 'exam' });
      SLOTS.all = (r && r.slots) || [];
    } catch (e) { SLOTS.all = []; }
    if (t) t.remove();
  }

  const blizke = nextSlots(SLOTS.all, expand ? 20 : 4);

  if (!blizke.length) {
    await marcelSays('Volné termíny se mi teď nepodařilo načíst. Zkuste to prosím ' +
      'za chvíli znovu — nebo mi napište a ozvu se Vám s termínem e-mailem.');
    return;
  }

  if (!expand) {
    const doTydne = blizke[0].getTime() <= Date.now() + 7 * 86400000;
    await marcelSays(doTydne
      ? 'Tady jsou nejbližší volné termíny. Do vyšetření musíte stihnout odběr krve — žádanku Vám pošlu e-mailem hned po platbě, takže na to budete mít čas.'
      : 'Nejbližší volno mám bohužel až tady. Pro odběr krve je to vlastně dobře, budete ho mít v klidu — žádanku Vám pošlu e-mailem hned po platbě.');
  }

  const row = expand ? null : bubble('<div class="slots" id="slotbox"></div>');
  const host = expand || (row && row.querySelector('#slotbox'));
  host.innerHTML = '';
  for (const d of blizke) {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'slot';
    el.dataset.iso = d.toISOString();
    el.innerHTML = '<span><span class="sd">' + slotDay(d) + ' ' + slotDate(d) +
      '</span><span class="sw">' + (SLOTS.form === 'online' ? 'online' : 'osobně v Praze') +
      ' · ' + (D.examMinutes || 30) + ' minut</span></span>' +
      '<span class="st">' + slotTime(d) + '</span>';
    host.appendChild(el);
    buzz(6); scroll();
    await wait(260);
  }
  if (!expand && SLOTS.all.length > blizke.length) {
    const more = document.createElement('button');
    more.type = 'button';
    more.className = 'slot more';
    more.dataset.more = '1';
    more.innerHTML = '<span class="sd">Chci jiný termín</span>';
    host.appendChild(more);
    scroll();
  }

  host.addEventListener('click', async e => {
    const el = e.target.closest('.slot');
    if (!el || host._done) return;
    if (el.dataset.more) { host._done = true; await renderSlots(host); return; }
    host._done = true;
    host.querySelectorAll('.slot').forEach(x => x.classList.remove('sel'));
    el.classList.add('sel');
    host.querySelectorAll('.slot.more').forEach(x => x.remove());
    buzz(12);
    await pickSlot(el.dataset.iso);
  }, { once: false });
}

/* Zabere termín a ukáže platbu. Rezervace drží, dokud nedorazí platba —
   proto se tu nic neslibuje dřív, než server termín opravdu zapíše. */
async function pickSlot(isoUtc) {
  const d = new Date(isoUtc);
  const lidsky = slotDay(d) + ' ' + slotDate(d) + ' v ' + slotTime(d);
  logLine('klient', 'Vybral termín ' + lidsky);
  const local = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0') + 'T' + String(d.getHours()).padStart(2, '0') +
    ':' + String(d.getMinutes()).padStart(2, '0');

  const t = typing();
  let r = null, chyba = '';
  try {
    r = await api('hold', { kind: 'exam', slot: local, type: SLOTS.form || 'osobne',
      id: S.id, name: D.fullName || D.name, email: D.email, phone: D.phone,
      /* Souhlasy klient odklikl v předchozí kapitole. Posíláme je tak, jak
         jsou — když je neodklikl, rezervaci server odmítne, a to je správně. */
      consent: S.consent === true, src: 'econsult' }, 25000);
  } catch (e) { chyba = (e && e.message) || 'nepodarilo'; }
  t.remove();

  if (!r || !r.ok) {
    bubble(chyba === 'slot_taken'
      ? 'Ten termín mi právě vzali před nosem. Vyberte si prosím jiný.'
      : 'Termín se mi nepodařilo zabrat. Zkuste to prosím ještě jednou, nebo nám zavolejte na ' + esc(CFG.phone) + '.');
    SLOTS.all = [];
    await renderSlots();
    return;
  }
  SLOTS.picked = lidsky; SLOTS.vs = r.vs; save();

  await marcelSays('Termín <b>' + lidsky + '</b> je zabraný. Potvrdí se v okamžiku, kdy dorazí platba.');
  await marcelSays('Než zaplatíte, dvě věci, na kterých záleží. <b>Žádanku na odběr krve</b> ' +
    'Vám pošlu e-mailem hned po platbě a odběr musíte stihnout <b>nejpozději dva dny před vyšetřením</b> — ' +
    'laboratoř potřebuje čas na výsledky a bez nich Vám lékař terapii neschválí.');
  await marcelSays('A až odběr absolvujete, <b>klepnete u sebe v rezervaci na „Byl jsem na odběru“</b>. ' +
    'Podle toho víme, že má vyšetření smysl. Kdo to nepotvrdí, tomu termín musíme přesunout.');
  await marcelSays(payCard(r, lidsky));
  persist('book-hold');
}

/* Jedna bublina od Marcela, i mimo scénář: tečky, pauza, text. */
async function marcelSays(html) {
  const t = typing();
  await wait(pace(html));
  t.remove();
  bubble(html);
  logLine('marcel', html);
  await wait(300);
}

function payCard(r, lidsky) {
  /* Co klient podepisuje svou platbou, se říká před ní, ne pod tlačítkem.
     Pod tlačítkem to přečte až ten, kdo váhá — a to je pozdě. */
  const presun = 'Termín <b>přesunete nebo zrušíte sám</b> ve své rezervaci, odkaz máte ' +
    'v potvrzovacím e-mailu, nebo rovnou v pozvánce v kalendáři. Zdarma, nejpozději ' +
    (D.rescheduleHours || 12) + ' hodin předem. <b>Nevolejte nám</b> — udělejte to elektronicky, ' +
    'ať se to u nás propíše hned a termín může dostat někdo jiný.';
  const btn = r.checkoutUrl
    ? '<a class="pay" href="' + esc(r.checkoutUrl) + '">Zaplatit kartou · ' + fmt(CFG.screeningPrice) + ' Kč</a>'
    : '<div class="paynote">Platební bránu se mi teď nepodařilo otevřít. Napište mi a pošlu Vám odkaz na platbu e-mailem.</div>';
  return '<div class="sum"><div class="sh">' +
      '<div class="se">Vstupní screening</div>' +
      '<div class="sn">' + esc(lidsky) + '</div>' +
    '</div><div class="sb">' +
      '<div class="kv"><span>Odběr krve v Synlabu</span><b>v ceně</b></div>' +
      '<div class="kv"><span>Vyšetření lékařem</span><b>v ceně</b></div>' +
      '<div class="kv"><span>Forma</span><b>' + (SLOTS.form === 'online' ? 'online' : 'osobně v Praze') + '</b></div>' +
      '<div class="kv"><span>Celkem</span><b>' + fmt(CFG.screeningPrice) + ' Kč jednorázově</b></div>' +
    '</div></div>' + btn +
    '<div class="paynote">Platba běží přes zabezpečenou bránu Stripe. ' +
      'Údaje o kartě vidí jen ona, my se k nim nedostaneme.<br><br>' + presun + '</div>';
}

/* ---------- běh scénáře ---------- */
const CHAPTER_OF = { intro: 'intro', vas: 'vas', vas2: 'vas', vas3: 'vas', howAsk: 'how', how: 'how', drug: 'drug',
  form: 'form', dose: 'dose', expect: 'expect', plan: 'plan', price: 'plan', benefits: 'benefits',
  care: 'care', pharmacy: 'care', screening: 'screening', faq: 'faq', included: 'faq', consent: 'faq',
  book: 'book', bookLater: 'book', bookForm: 'book',
  bookSlots: 'book', blocked: 'intro' };

async function play(key) {
  if (busy) return;
  busy = true;
  S.chapter = key; save();
  persist(key);
  renderProgress(CHAPTER_OF[key] || key);
  setChips([]);
  const beats = SCRIPT[key] || [];
  /* Od kolikáté repliky kapitoly se pokračuje. Když klient čekání přerušil
     tlačítkem, vrátíme se sem a dopíšeme zbytek. */
  let i = S.beat || 0;
  S.beat = 0;
  let run = 0;
  for (; i < beats.length; i++) {
    const beat = beats[i];
    if (beat.chips) { setChips(beat.chips); break; }
    if (beat.ask) { askMode(beat); busy = false; return; }
    if (beat.vars) { await renderVariants(); busy = false; return; }
    if (beat.slots) { await renderSlots(); busy = false; return; }
    if (beat.cons) { renderConsents(); busy = false; return; }
    /* Dvě zprávy a dost: dál až když klient dá vědět, že čte. Poslední
       repliku kapitoly nepřerušujeme, za ní stejně následuje nabídka. */
    if (run >= MAX_RUN && i < beats.length - 1) {
      S.beat = i; save();
      setChips([{ label: dalLabel(beats[i - 1]), go: key, resume: true }]);
      busy = false;
      return;
    }
    const txt = typeof beat.t === 'function' ? beat.t() : beat.t;
    const t = typing();
    await wait(pace(txt));
    t.remove();
    const card = beat.card ? (typeof beat.card === 'function' ? beat.card() : beat.card) : '';
    bubble(txt + card, { cls: beat.cls });
    logLine('marcel', txt);
    if (beat.final) { finalScreen(key); }
    run++;
    await wait(420);
  }
  busy = false;
}

function finalScreen(key) {
  if (key === 'book') {
    const url = CFG.bookingUrl + '/?kind=exam' + (S.id ? '&id=' + encodeURIComponent(S.id) : '');
    setChips([{ label: 'Vybrat termín a zaplatit', href: url, primary: true }]);
    $('#askbox').style.display = 'none';
  } else {
    setChips([]);
    $('#askbox').style.display = 'none';
  }
}

let pending = null;
function askMode(beat) {
  pending = beat;
  const ta = $('#ask');
  ta.placeholder = beat.placeholder || 'Napište mi to…';
  ta.focus();
  // Na mobilu vyjede klávesnice a ukrojí půl obrazovky. Totéž co u nabídky.
  requestAnimationFrame(scroll);
}

function logLine(who, text) {
  S.log.push({ who, text: String(text).replace(/<[^>]*>/g, ''), at: Date.now() });
  if (S.log.length > 400) S.log.shift();
  save();
}

/* ---------- interakce ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const list = $('#chips')._list || [];
  const c = list[Number(b.dataset.i)];
  if (!c) return;
  if (c.href) { location.href = c.href; return; }
  /* „Pokračovat" není odpověď, jen pokyn psát dál. Do bubliny ani do přepisu
     nepatří — přepis je důkaz o tom, co klientovi řekl a co odsouhlasil. */
  if (!c.resume) {
    bubble(esc(c.label), { me: true });
    logLine('klient', c.label);
  }
  setChips([]);
  if (c.store) { S.answers[c.store[0]] = c.store[1]; save(); }
  if (c.consent) { S.consent = true; save(); }
  if (c.form) { SLOTS.form = c.form; save(); }
  /* Klient se chce na něco zeptat. Nikam ho nepřesouváme — zůstane v téhle
     kapitole, odpoví mu model a backToFlow mu pak vrátí tytéž nabídky. */
  if (c.prompt) {
    busy = true;
    const t = typing();
    await wait(pace(c.prompt));
    t.remove();
    bubble(c.prompt);
    logLine('marcel', c.prompt);
    busy = false;
    const ta = $('#ask');
    ta.placeholder = 'Napište mi, co Vám na tom nesedí…';
    ta.focus();
    return;
  }
  if (c.faq) { await answerFaq(c.faq); return; }
  if (c.go) play(c.go);
});

/* Většina odpovědí je prostý text, dvě se ohýbají podle pohlaví a jsou
   proto funkce. Tohle je srovná, ať se volající nemusí ptát která je která. */
function faqText(key) {
  const a = FAQ[key];
  return typeof a === 'function' ? a() : (a || '');
}

async function answerFaq(key) {
  S.asked[key] = Date.now(); save();
  const answer = faqText(key);
  /* Když scénář zrovna běží, počkáme. Dvě odpovědi psané přes sebe si
     navzájem přepisují tečky a jedna z nich se ztratí — klient pak klepne
     na otázku a nedostane nic. */
  for (let i = 0; i < 100 && busy; i++) await new Promise(r => setTimeout(r, 150));
  busy = true;
  const t = typing();
  await wait(pace(answer));
  t.remove();
  bubble(answer || 'Na tohle Vám radši odpoví lékař — poznamenám si to.');
  logLine('marcel', answer);
  busy = false;
  await wait(200);
  backToFlow();
}

function backToFlow() {
  const k = S.chapter;
  const beats = SCRIPT[k] || [];
  /* Klient se zeptal ve chvíli, kdy Marcel čekal na pokyn psát dál. Vrátit
     ho na konec kapitoly by mu sebralo zbytek výkladu, za který zaplatil —
     nabídneme mu tutéž repliku, u které jsme stáli. */
  if (S.beat > 0 && S.beat < beats.length) {
    setChips([{ label: dalTed || 'Pokračovat', go: k, resume: true }]);
    return;
  }
  const last = beats.filter(b => b.chips).pop();
  if (last) setChips(last.chips);
}

$('#ask').addEventListener('input', e => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(120, e.target.scrollHeight) + 'px';
});
$('#ask').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitAsk(); }
});
$('#sendBtn').addEventListener('click', submitAsk);

/* Dotaz, který čeká, až Marcel dopíše rozepsanou repliku. */
let fronta = null;

async function submitAsk() {
  const ta = $('#ask');
  const text = ta.value.trim();
  if (!text) return;
  ta.value = ''; ta.style.height = 'auto';
  bubble(esc(text), { me: true });
  logLine('klient', text);

  /* Klient napsal uprostřed toho, co Marcel zrovna píše. Jeho bublina
     naskočila hned — vidí, že zpráva dorazila — a my počkáme, až Marcel
     dopíše, a teprve pak odpovíme. Dřív se v takové chvíli nestalo vůbec
     nic a na telefonu to vypadalo, že appka zamrzla.

     Když mezitím pošle další dotaz, ten novější vyhrává a tenhle se tiše
     vzdá: odpovídat na dvě otázky najednou nedává smysl. */
  if (busy) {
    fronta = text;
    for (let i = 0; i < 150 && busy; i++) await new Promise(r => setTimeout(r, 200));
    if (fronta !== text) return;
    fronta = null;
  }

  if (pending) {                       // odpověď na otázku ze scénáře
    const beat = pending; pending = null;
    ta.placeholder = 'Zeptejte se mě na cokoli…';
    S.answers[beat.ask] = text; save();
    const beats = SCRIPT[S.chapter];
    const from = beats.indexOf(beat) + 1;
    busy = true;
    for (let i = from; i < beats.length; i++) {
      const b = beats[i];
      if (b.chips) { setChips(b.chips); break; }
      if (b.ask) { askMode(b); break; }
      const txt = typeof b.t === 'function' ? b.t() : b.t;
      const t = typing();
      await wait(pace(txt));
      t.remove();
      bubble(txt + (b.card ? (typeof b.card === 'function' ? b.card() : b.card) : ''), { cls: b.cls });
      logLine('marcel', txt);
      await wait(240);
    }
    busy = false;
    return;
  }

  /* Volný dotaz. Odpovídá model na serveru — podklady i instrukce jsou tam,
     ne tady, takže si je nikdo nemůže přepsat v prohlížeči.

     Když model z jakéhokoli důvodu odpoví chybou, dotaz nesmí spadnout do
     prázdna: pošle se na kliniku a odpoví člověk. Klient si konzultaci
     zaplatil mimo jiné proto, aby se mohl ptát. */
  busy = true;
  const t = typing();
  let answer = '';
  let failed = '';
  try {
    if (DEMO_MODE || !CFG.apiUrl || !S.id) {
      failed = 'demo';
    } else {
      const hist = S.log.slice(-6).map(l => ({ role: l.who === 'klient' ? 'user' : 'assistant', text: l.text }));
      const r = await api('advisorAsk', { id: S.id, text, history: hist }, 60000);
      answer = String(r.text || '');
    }
  } catch (e) { failed = e.code || 'api'; }

  if (answer) {
    t.remove();
    // Model píše odstavce, ne HTML. Prázdný řádek dělá nový odstavec.
    bubble(answer.split(/\n{2,}/).map(x => esc(x.trim()).replace(/\n/g, '<br>')).filter(Boolean).join('<br><br>'));
    logLine('marcel', answer);
    busy = false;
    backToFlow();
    persist('dotaz');
    return;
  }

  // Odpověď nepřišla. Předáme dotaz lidem a řekneme to rovnou.
  let sent = false;
  try {
    if (CFG.apiUrl && S.id && !DEMO_MODE) { await api('question', { id: S.id, text }, 15000); sent = true; }
  } catch (e) { /* hláška níž to řekne i tak, dotaz zůstává v přepisu */ }
  await wait(400);
  t.remove();
  bubble(failed === 'advisor_limit'
    ? `Tolik otázek už jsem dneska zodpověděl — radši Vás teď předám kolegům. Napište na ${esc(CFG.email)} nebo zavolejte na ${esc(CFG.phone)}.`
    : sent
    ? 'Na tuhle otázku Vám radši odpoví člověk — poslal jsem ji kolegům na kliniku a ozveme se e-mailem, obvykle do druhého dne. Zatím můžeme pokračovat dál.'
    : `Tuhle otázku si poznamenávám, ale radši ji pošlete i na ${esc(CFG.email)} nebo zavolejte na ${esc(CFG.phone)} — ať nezapadne.`);
  busy = false;
  backToFlow();
}

/* ---------- ukládání důkazní stopy ----------------------------------------
   Přepis, verze scénáře, souhlasy a vybraná varianta. Posílá se v milnících,
   ne po každé replice — ať to nebombarduje backend. Když se nepovede, jede se
   dál: klient o konzultaci nepřijde kvůli tomu, že se nezapsal log. */
let lastSaved = 0;
async function persist(stage) {
  if (!CFG.apiUrl || !S.id || DEMO_MODE) return;
  if (Date.now() - lastSaved < 1500) return;
  lastSaved = Date.now();
  try {
    await api('econsultLog', {
      id: S.id, stage, scenario: D && D.scenario || '', hash: SCENARIO_HASH,
      variant: S.variant ? S.variant.name + ' · ' + S.variant.months + ' měs. · ' + S.variant.price + ' Kč' : '',
      consents: S.consents, log: S.log
    }, 15000);
  } catch (e) { /* důkazní stopa se doplní při dalším milníku */ }
}

/* Otisk textů scénáře. Když se texty změní, změní se i otisk — u starého
   klienta pak jde dokázat, co přesně viděl. */
const SCENARIO_HASH = (() => {
  const src = JSON.stringify(Object.keys(SCRIPT).map(k => SCRIPT[k].map(b => typeof b.t === 'string' ? b.t : (b.ask || b.vars || b.cons || '')))) +
    JSON.stringify(CONSENTS.map(c => c.t));
  let h = 0;
  for (let i = 0; i < src.length; i++) { h = ((h << 5) - h + src.charCodeAt(i)) | 0; }
  return (h >>> 0).toString(16).padStart(8, '0');
})();

/* ---------- start ---------- */
const DEMO_MODE = URLP.get('demo') === '1';

// 1 hodinu, 2–4 hodiny, 5 a víc hodin — česky se to prostě musí rozlišit.
const hodin = n => n === 1 ? '1 hodinu' : (n >= 2 && n <= 4 ? n + ' hodiny' : n + ' hodin');

function dataError(msg) {
  $('#way').style.display = 'none';
  bubble('Nepodařilo se načíst Vaše údaje ze screeningu. ' + esc(msg) +
    `<span class="note">Zkuste prosím otevřít odkaz z e‑mailu znovu, nebo nám zavolejte na ${esc(CFG.phone)}.</span>`, { cls: 'stop' });
  $('#askbox').style.display = 'none';
}

/* Zamčeno: konzultace není zaplacená, nebo jí vypršela platnost. Není to
   chyba, je to stav — proto se nechová jako chybová hláška, ale jako nabídka
   s tlačítkem. Klient se sem vrací přes rezervaci, kde se platí. */
/* Zavřená konzultace. Rozlišujeme dva úplně jiné lidi:

   Kdo nezaplatil, konzultaci teprve zvažuje — tomu ji nabídneme.

   Komu vypršela, ten už jednou zaplatil a byl na půl cesty k termínu.
   Poslat ho zpátky k pokladně s tím, ať si koupí další konzultaci, je
   nepochopení situace: on chtěl k lékaři. Proto je hlavní tlačítko
   rezervace vyšetření a další konzultace až jako vedlejší nabídka. */
function lockedPanel(expired) {
  $('#way').style.display = 'none';
  $('#askbox').style.display = 'none';
  const id = encodeURIComponent(S.id || '');
  const konzultace = CFG.bookingUrl + '/?id=' + id;
  const vysetreni = CFG.bookingUrl + '/?kind=exam&id=' + id;

  if (!expired) {
    bubble('Tahle konzultace ještě není zaplacená.');
    bubble(`Vstupní konzultace se mnou stojí <b>${fmt(CFG.advisorPrice)} Kč</b> a tu částku Vám odečteme ` +
      `z první platby za program. Po zaplacení se mnou můžete začít hned a ${CFG.validHours} hodin se sem vracet.` +
      `<span class="note"><a href="${esc(konzultace)}" style="color:inherit">Objednat konzultaci ›</a></span>`,
      { cls: 'stop' });
    return;
  }

  bubble(`Platnost téhle konzultace vypršela — odkaz žije ${CFG.validHours} hodin od zaplacení.`);
  bubble('Pokud jste si z ní odnesl to podstatné, dalším krokem je <b>vstupní screening</b>: ' +
    `odběr krve v Synlabu a vyšetření lékařem, <b>${fmt(CFG.screeningPrice)} Kč</b> jednorázově. ` +
    'Termín si vyberete rovnou tady.' +
    `<a class="pay" href="${esc(vysetreni)}">Vybrat termín vyšetření</a>` +
    `<div class="paynote">Chcete si ještě popovídat? Další konzultace stojí ${fmt(CFG.advisorPrice)} Kč ` +
    `a taky se odečítá z první platby za program. <a href="${esc(konzultace)}" style="color:inherit">` +
    'Objednat konzultaci ›</a></div>');
}

async function boot() {
  load();
  if (URLP.get('id')) S.id = URLP.get('id');

  if (DEMO_MODE || !S.id) { D = DEMO; }
  else {
    const t = typing();
    try { D = await api('econsult', { id: S.id }); }
    catch (e) {
      t.remove();
      if (e.code === 'advisor_locked' || e.code === 'advisor_expired') {
        lockedPanel(e.code === 'advisor_expired');
        return;
      }
      dataError(e.code === 'not_found' ? 'Screening s tímto odkazem jsme nenašli.' : '');
      return;
    }
    t.remove();
    /* Kolik času zbývá, musí klient vidět, ne hádat. Je to zároveň jediné
       místo, kde se to dá říct nevtíravě — spodní řádek stránky. */
    if (D.hoursLeft) {
      const hint = $('#hint');
      if (hint) hint.textContent = 'Marcel AI je digitální kopie konzultanta Marcela. ' +
        'Konzultace je zaplacená a vrátit se k ní můžete ještě ' + hodin(D.hoursLeft) + '. ' +
        'O vhodnosti terapie vždy rozhoduje lékař.';
    }
  }

  if (D.blocked) { play('blocked'); persist('kontraindikace'); return; }
  play(S.chapter && SCRIPT[S.chapter] ? S.chapter : 'intro');
}
boot();

/* ---------- české sirotky ----------------------------------------------
   Jednopísmenné předložky a spojky (k, s, v, z, o, u, a, i) ani krátké
   předložky typu „na“ nebo „do“ nesmí zůstat viset na konci řádku. Stejně
   tak se nemá rozpadnout číslo od jednotky („30 minut“, „5 170 Kč“).
   Běží i nad obsahem, který se dokresluje později. */
const ORPHAN_RE = /(^|[\s(„"'»–—])((?:[aiksuvozAIKSUVOZ]|[Dd]o|[Nn]a|[Pp]o|[Zz]a|[Oo]d|[Vv]e|[Zz]e|[Ss]e|[Kk]e|[Pp]ro|[Pp]ři|[Bb]ez|[Nn]ad|[Pp]od|[Žž]e)) /g;
function fixTextNode(n) {
  const t = n.data.replace(ORPHAN_RE, '$1$2 ').replace(/(\d) (?=\S)/g, '$1 ');
  if (t !== n.data) n.data = t;
}
function fixOrphans(root) {
  if (!root) return;
  if (root.nodeType === 3) { fixTextNode(root); return; }
  if (root.nodeType !== 1 && root.nodeType !== 9 && root.nodeType !== 11) return;
  const skip = { SCRIPT: 1, STYLE: 1, TEXTAREA: 1, SVG: 1, CODE: 1 };
  const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => {
      const p = n.parentNode;
      if (!p || skip[p.nodeName]) return NodeFilter.FILTER_REJECT;
      if (p.closest && p.closest('[data-nonbsp]')) return NodeFilter.FILTER_REJECT;
      return n.data.indexOf(' ') < 0 ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
    }
  });
  const out = [];
  for (let n = walk.nextNode(); n; n = walk.nextNode()) out.push(n);
  out.forEach(fixTextNode);
}
try {
  fixOrphans(document.body);
  new MutationObserver(ms => {
    ms.forEach(m => m.addedNodes.forEach(fixOrphans));
  }).observe(document.body, { childList: true, subtree: true });
} catch (e) { /* bez tohohle stránka funguje dál, jen se hůř láme */ }
</script>
